# Lesson 11.2: lesson 9.2's production file, plus a healthcheck for the worker and the proxy, the two
# services that had none.
#   docker compose -f compose.yaml -f compose.prod.yaml -f compose.hardened.yaml up -d --wait

# One logging setup for every service: Docker's local driver, rotated (lesson 3.1 showed the default).
x-logging: &logging
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    <<: *logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  migrate:
    <<: *logging

  api:
    <<: *logging
    build: !reset null            # a server runs the image CI built and pushed (lesson 11.3)
    image: brightlane/pricing:0.8
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m

  worker:
    <<: *logging
    restart: unless-stopped
    # The worker serves no requests; healthy means it can reach the database with its own settings.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; from pricing import db; sys.exit(db.ping() != 'ok')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m           # lesson 3.3: a month's statement needs a 158 MiB peak

  proxy:
    <<: *logging
    restart: unless-stopped
    # Through the proxy to the API's liveness endpoint: healthy means a request gets through.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    deploy:
      resources:
        limits:
          memory: 64m
