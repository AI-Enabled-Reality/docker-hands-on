# Lesson 9.3, the second break: the upstream named directly in proxy_pass, without a resolver.
# nginx looks the name up once, when it starts, and keeps those addresses.
events {}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    server {
        listen 8080;

        location / {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_connect_timeout 3s;
        }
    }
}
