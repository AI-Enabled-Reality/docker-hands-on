# Exercise 9.1: the pricing stack as project m09x1, proxy on 127.0.0.1:8792. Your compose.override.yaml,
# next to this file, adds the development loop.
#   cd module-09/exercises/exercise-1 && docker compose up --watch
name: m09x1

services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: pricing
      POSTGRES_PASSWORD: pricing-lab-only
      POSTGRES_DB: pricing
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Over TCP: during its first start the image runs a temporary server that only listens on a
      # local socket. -h 127.0.0.1 waits for the real one.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "pricing", "-d", "pricing"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s

  migrate:
    image: postgres:18.6-trixie
    entrypoint: ["sh", "/migrate.sh"]
    environment:
      PGHOST: db
      PGUSER: pricing
      PGPASSWORD: pricing-lab-only
      PGDATABASE: pricing
    volumes:
      - ../../../module-08/02-start-order/migrate.sh:/migrate.sh:ro
      - ../../../app/db/init:/init:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ../../../app
    image: brightlane/pricing:0.8
    environment:
      PRICING_DATABASE_URL: postgresql://pricing@db:5432/pricing
      PRICING_DATABASE_PASSWORD: pricing-lab-only
    healthcheck:
      # Readiness: the API answers and reaches its database. That's what the proxy waits for.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 1s
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: brightlane/pricing:0.8
    command: ["worker"]
    environment:
      PRICING_DATABASE_URL: postgresql://pricing@db:5432/pricing
      PRICING_DATABASE_PASSWORD: pricing-lab-only
    volumes:
      - exports:/exports
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  proxy:
    image: nginx:1.30.6-alpine
    ports:
      - "127.0.0.1:8792:8080"
    volumes:
      - ../../../module-08/01-the-stack/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  exports:
