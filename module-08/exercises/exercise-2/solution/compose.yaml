# Exercise 8.2, a possible solution: lesson 8.2's stack with a backup job in the profile ops.
#   docker compose -f module-08/exercises/exercise-2/compose.yaml up -d --wait
name: m08x2

services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: pricing
      POSTGRES_PASSWORD: pricing-lab-only
      POSTGRES_DB: pricing
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      # Over TCP: during its first start the image runs a temporary server that only listens on a
      # local socket. -h 127.0.0.1 waits for the real one.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "pricing", "-d", "pricing"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s

  migrate:
    image: postgres:18.6-trixie
    entrypoint: ["sh", "/migrate.sh"]
    environment:
      PGHOST: db
      PGUSER: pricing
      PGPASSWORD: pricing-lab-only
      PGDATABASE: pricing
    volumes:
      - ../../02-start-order/migrate.sh:/migrate.sh:ro
      - ../../../app/db/init:/init:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ../../../app
    image: brightlane/pricing:0.8
    environment:
      PRICING_DATABASE_URL: postgresql://pricing@db:5432/pricing
      PRICING_DATABASE_PASSWORD: pricing-lab-only
    healthcheck:
      # Readiness: the API answers and reaches its database. That's what the proxy waits for.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 1s
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: brightlane/pricing:0.8
    command: ["worker"]
    environment:
      PRICING_DATABASE_URL: postgresql://pricing@db:5432/pricing
      PRICING_DATABASE_PASSWORD: pricing-lab-only
    volumes:
      - exports:/exports
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  proxy:
    image: nginx:1.30.6-alpine
    ports:
      - "127.0.0.1:8782:8080"
    volumes:
      - ../../01-the-stack/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy

  # The ops job: one compressed dump per run, into .lab/m08x2/ on your Mac.
  #   docker compose -f module-08/exercises/exercise-2/compose.yaml run --rm backup
  backup:
    image: postgres:18.6-trixie
    profiles: [ops]
    # $$ passes a literal $ to the shell (lesson 8.3). Required before a name; clearer everywhere.
    entrypoint: ["sh", "-c", "pg_dump -Fc -f /backups/pricing-$$(date +%Y%m%d-%H%M%S).dump && ls -l /backups"]
    environment:
      PGHOST: db
      PGUSER: pricing
      PGPASSWORD: pricing-lab-only
      PGDATABASE: pricing
    volumes:
      - ../../../.lab/m08x2:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  exports:
