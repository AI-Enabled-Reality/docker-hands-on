# Exercise 8.1, a possible solution: start/run-stack.sh as a Compose file.
#   docker compose -f module-08/exercises/exercise-1/compose.yaml up -d --wait
name: m08x1

services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: pricing
      POSTGRES_PASSWORD: pricing-lab-only
      POSTGRES_DB: pricing
    volumes:
      - pgdata:/var/lib/postgresql
      - ../../../app/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "pricing", "-d", "pricing"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 1s

  pricing-api:
    image: brightlane/pricing:0.8
    environment:
      PRICING_DATABASE_URL: postgresql://pricing@db:5432/pricing
      PRICING_DATABASE_PASSWORD: pricing-lab-only
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 1s
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: nginx:1.30.6-alpine
    ports:
      - "127.0.0.1:8781:8080"
    volumes:
      - ./start/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      pricing-api:
        condition: service_healthy

volumes:
  pgdata:
