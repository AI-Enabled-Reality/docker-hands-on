# Exercise 8.1: the reverse proxy in front of the pricing API.
events {}

http {
    # Docker's embedded DNS server. Looking the API up per request (through the variable below)
    # lets nginx start before the API exists, and follows the API to a new IP after a restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    server {
        listen 8080;

        location / {
            set $api http://pricing-api:8000;
            proxy_pass $api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 3s;
        }
    }
}
