# The platform team's proxy, shared by every Brightlane stack (lesson 8.3). A project brings it in with
#   include: [platform/proxy.yaml]
# Relative paths in this file are relative to this file's folder.
services:
  proxy:
    image: nginx:1.30.6-alpine
    ports:
      - "127.0.0.1:${PROXY_PORT:-8700}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
