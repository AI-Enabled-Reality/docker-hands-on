# Lesson 8.3: the pricing stack, configured from .env, an env file, profiles and the platform's proxy.
#   cd module-08/03-config && cp .env.example .env && docker compose up -d --wait
name: brightlane

include:
  - platform/proxy.yaml

# An extension field: Compose ignores top-level keys that start with x-. The YAML anchor (&) lets
# api and worker share these settings (*).
x-pricing: &pricing
  image: brightlane/pricing:${PRICING_TAG:-0.8}
  env_file: pricing.env
  environment:
    PRICING_DATABASE_URL: postgresql://pricing@db:5432/pricing
    PRICING_DATABASE_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (see .env.example)}
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: pricing
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: pricing
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "pricing", "-d", "pricing"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s

  migrate:
    image: postgres:18.6-trixie
    entrypoint: ["sh", "/migrate.sh"]
    environment:
      PGHOST: db
      PGUSER: pricing
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (see .env.example)}
      PGDATABASE: pricing
    volumes:
      - ../02-start-order/migrate.sh:/migrate.sh:ro
      - ../../app/db/init:/init:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *pricing
    build: ../../app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 1s

  worker:
    <<: *pricing
    command: ["worker"]
    volumes:
      - exports:/exports
    restart: unless-stopped

  # Started only when asked for: docker compose run --rm psql
  psql:
    image: postgres:18.6-trixie
    profiles: [tools]
    entrypoint: ["psql"]
    environment:
      PGHOST: db
      PGUSER: pricing
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (see .env.example)}
      PGDATABASE: pricing
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  exports:
