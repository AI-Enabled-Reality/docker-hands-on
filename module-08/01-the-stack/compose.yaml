# Lesson 8.1: the pricing stack. Four docker run commands become one file.
#   cd module-08/01-the-stack && docker compose up -d
name: brightlane

services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: pricing
      POSTGRES_PASSWORD: pricing-lab-only
      POSTGRES_DB: pricing
    volumes:
      - pgdata:/var/lib/postgresql
      # Run once, when the data volume is new: the schema and the seed.
      - ../../app/db/init:/docker-entrypoint-initdb.d:ro

  api:
    build: ../../app               # app/Dockerfile
    image: brightlane/pricing:0.8
    environment:
      PRICING_DATABASE_URL: postgresql://pricing@db:5432/pricing
      PRICING_DATABASE_PASSWORD: pricing-lab-only

  worker:
    image: brightlane/pricing:0.8
    command: ["worker"]
    environment:
      PRICING_DATABASE_URL: postgresql://pricing@db:5432/pricing
      PRICING_DATABASE_PASSWORD: pricing-lab-only
    volumes:
      - exports:/exports
    restart: unless-stopped

  proxy:
    image: nginx:1.30.6-alpine
    ports:
      - "127.0.0.1:8700:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
  exports:
