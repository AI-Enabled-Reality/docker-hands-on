[project]
name = "brightlane-pricing"
version = "1.0.0"
description = "Brightlane Charging's pricing service: the pricing API and the statement worker."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi==0.161.1",
    "uvicorn==0.54.0",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "pydantic-settings==2.16.1",
    "duckdb==2.0.0",
]

[project.scripts]
pricing = "pricing.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx2==2.16.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pricing"

[tool.pytest.ini_options]
testpaths = ["tests"]
